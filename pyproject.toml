[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-blackwell-nextgen"
version = "1.0.0"
description = "Four NVIDIA Blackwell (GB200 / sm_100a / NVL72) Systems & Algorithms Breakthroughs: Dual-NVFP4, C2C-SparseKV, Epi-NVLS/P2P-RS, and TMEM-SSM."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[tool.setuptools.packages.find]
include = ["apex_blackwell*"]
